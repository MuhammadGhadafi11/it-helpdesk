<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Pengguna — IT Helpdesk & Ticketing System</title>
  <!-- Urutan CSS: style.css → dashboard.css → admin.css → manage-users.css -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/manage-users.css" />
</head>
<body>

  <div class="dashboard-layout">

    <!-- ========================================================
         SIDEBAR ADMIN
         Identik dengan admin-dashboard.html dan manage-tickets.html.
         Nav item "Pengguna" diberi class "active".
         ======================================================== -->
    <aside class="sidebar" role="navigation" aria-label="Menu admin">

      <!-- Brand -->
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z" />
            <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" />
          </svg>
        </div>
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-name">IT Helpdesk</span>
          <span class="sidebar-brand-sub">Admin Panel</span>
        </div>
      </div>

      <!-- Info admin — diisi oleh renderUsersSidebar() -->
      <div class="sidebar-user">
        <div class="sidebar-user-name" id="sidebar-user-name">Memuat...</div>
        <span class="sidebar-user-role" id="sidebar-user-role">Admin</span>
      </div>

      <!-- Navigasi Admin -->
      <nav class="sidebar-nav" aria-label="Menu admin">
        <div class="nav-label">Menu</div>

        <a href="admin-dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3"  y="3"  width="7" height="7" rx="1" />
            <rect x="14" y="3"  width="7" height="7" rx="1" />
            <rect x="3"  y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Dashboard
        </a>

        <a href="manage-tickets.html" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="9"  y1="13" x2="15" y2="13" />
            <line x1="9"  y1="17" x2="13" y2="17" />
          </svg>
          Kelola Tiket
        </a>

        <!-- Pengguna — aktif -->
        <a href="manage-users.html" class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Pengguna
        </a>
      </nav>

      <!-- Logout -->
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn-logout" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Logout
        </button>
      </div>

    </aside><!-- /.sidebar -->


    <!-- ========================================================
         MAIN CONTENT
         ======================================================== -->
    <main class="main-content">

      <!-- Topbar -->
      <div class="topbar">
        <div>
          <div class="topbar-title">Kelola Pengguna</div>
          <div class="topbar-subtitle">Lihat, tambah, dan kelola akun pengguna sistem</div>
        </div>
      </div>

      <!-- Konten halaman -->
      <div class="page-content">

        <!-- Layout dua panel: tabel kiri + form tambah kanan -->
        <div class="users-layout">

          <!-- ================================================
               PANEL KIRI: Tabel Pengguna
               ================================================ -->
          <div class="users-left">

            <!-- Toolbar: jumlah user -->
            <div class="users-toolbar">
              <span class="user-count-text">
                Total: <strong id="user-count">0 akun</strong>
              </span>
            </div>

            <!-- ── Tabel User ── -->
            <!-- Dikontrol oleh renderUsersTable() di manage-users.js -->
            <div id="users-table-wrap" class="users-table-wrapper">
              <table class="users-table" aria-label="Daftar pengguna sistem">
                <thead>
                  <tr>
                    <th class="ucol-id">ID</th>
                    <th class="ucol-name">Nama</th>
                    <th class="ucol-username">Username</th>
                    <th class="ucol-role">Role</th>
                    <th class="ucol-status">Status</th>
                    <th class="ucol-date">Tgl. Dibuat</th>
                    <th class="ucol-action">Aksi</th>
                  </tr>
                </thead>
                <!-- Baris diisi oleh renderUsersTable() -->
                <tbody id="users-tbody"></tbody>
              </table>
            </div><!-- /#users-table-wrap -->

            <!-- ── Empty State ── -->
            <!-- Fallback jika LocalStorage tidak memiliki user sama sekali -->
            <div id="empty-all" class="users-empty" role="status">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
              </svg>
              <p>Belum ada akun pengguna terdaftar.</p>
            </div>

          </div><!-- /.users-left -->


          <!-- ================================================
               PANEL KANAN: Form Tambah User Baru
               ================================================ -->
          <div class="users-right">
            <div class="add-user-card">

              <div class="add-user-card-header">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="8.5" cy="7" r="4" />
                  <line x1="20" y1="8" x2="20" y2="14" />
                  <line x1="23" y1="11" x2="17" y2="11" />
                </svg>
                <span class="add-user-card-title">Tambah User Baru</span>
              </div>

              <div class="add-user-card-body">

                <!-- Info: role baru selalu 'user' -->
                <div class="role-info">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8"  x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                  </svg>
                  Akun baru akan selalu memiliki role <strong>User</strong>.
                </div>

                <!-- Banner error form-level -->
                <!-- Ditampilkan oleh showFormError() jika validasi gagal -->
                <div id="form-error-msg" class="form-error-banner" role="alert">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8"  x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                  </svg>
                  <span></span>
                </div>

                <!-- Banner sukses form-level -->
                <!-- Ditampilkan oleh showFormSuccess() setelah berhasil -->
                <div id="form-success-msg" class="form-success-banner" role="status">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                  </svg>
                  <span></span>
                </div>

                <!-- Form tambah user -->
                <form id="form-add-user" novalidate>

                  <!-- Nama Lengkap -->
                  <div class="form-group">
                    <label class="form-label" for="field-name">
                      Nama Lengkap
                      <span style="color:var(--color-error);" aria-hidden="true"> *</span>
                    </label>
                    <input
                      id="field-name"
                      class="form-input"
                      type="text"
                      placeholder="Contoh: Andi Prasetyo"
                      autocomplete="off"
                      aria-describedby="error-field-name"
                      aria-required="true"
                    />
                    <span id="error-field-name" class="field-error" role="alert"></span>
                  </div>

                  <!-- Username -->
                  <div class="form-group">
                    <label class="form-label" for="field-username">
                      Username
                      <span style="color:var(--color-error);" aria-hidden="true"> *</span>
                    </label>
                    <input
                      id="field-username"
                      class="form-input"
                      type="text"
                      placeholder="Contoh: andi2025"
                      autocomplete="off"
                      aria-describedby="error-field-username"
                      aria-required="true"
                    />
                    <span id="error-field-username" class="field-error" role="alert"></span>
                  </div>

                  <!-- Password -->
                  <div class="form-group">
                    <label class="form-label" for="field-password">
                      Password
                      <span style="color:var(--color-error);" aria-hidden="true"> *</span>
                    </label>
                    <input
                      id="field-password"
                      class="form-input"
                      type="password"
                      placeholder="Minimal 6 karakter"
                      autocomplete="new-password"
                      aria-describedby="error-field-password"
                      aria-required="true"
                    />
                    <span id="error-field-password" class="field-error" role="alert"></span>
                  </div>

                  <!-- Tombol Submit -->
                  <button type="submit" class="btn btn-primary btn-add-user">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                      <circle cx="8.5" cy="7" r="4" />
                      <line x1="20" y1="8" x2="20" y2="14" />
                      <line x1="23" y1="11" x2="17" y2="11" />
                    </svg>
                    Tambah User
                  </button>

                </form><!-- /#form-add-user -->

              </div><!-- /.add-user-card-body -->
            </div><!-- /.add-user-card -->
          </div><!-- /.users-right -->

        </div><!-- /.users-layout -->

      </div><!-- /.page-content -->
    </main><!-- /.main-content -->

  </div><!-- /.dashboard-layout -->


  <!-- ============================================================
       TOAST NOTIFICATION
       Ditampilkan oleh showToast() setelah operasi berhasil
       ============================================================ -->
  <div id="toast-notification" class="toast" role="alert" aria-live="assertive">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
      <polyline points="22 4 12 14.01 9 11.01" />
    </svg>
    <!-- Teks diisi oleh showToast() -->
    <span id="toast-text"></span>
  </div>


  <!-- ============================================================
       SCRIPT — urutan wajib: utils.js → auth.js → manage-users.js
       ============================================================ -->
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/manage-users.js"></script>

</body>
</html>
